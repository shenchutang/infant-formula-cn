# _config.yml

title: "婴幼儿配方乳粉产品配方注册打分"
description: "婴幼儿配方乳粉产品配方注册信息对比国标，使用预定方案，模拟打分，仅供娱乐。"
url: "https://shenchutang.github.io"
baseurl: "/infant-formula-cn"

remote_theme: pages-themes/tactile@v0.2.0

markdown: kramdown
highlighter: rouge

plugins:
  - jekyll-remote-theme

# 让 README.md 作为主页
include:
  - README.md

# 可选：排除不需要参与构建的文件
exclude:
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor
  - .bundle
  - .sass-cache
  - .jekyll-cache

# 可选：仓库内 Markdown 链接、PDF、目录等资源可正常访问
keep_files:
  - infant-formula_md
  - infant-formula_pdf
  - infant-formula-1-single
  - infant-formula-2-single
  - infant-formula-3-single
